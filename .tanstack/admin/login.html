<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Astro Services</title>
    
    <!-- Admin Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/admin/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Inline auth check for login page - prevent redirect loop
        (function() {
            'use strict';
            
            // Only redirect if we're on login page AND have valid session
            if (window.location.pathname.includes('login.html')) {
                const sessionData = sessionStorage.getItem('astro_admin_session');
                
                if (sessionData) {
                    try {
                        const session = JSON.parse(sessionData);
                        const now = Date.now();
                        
                        // Only redirect if session is still valid
                        if (session.authenticated && now <= session.expiresAt) {
                            window.location.href = '/admin/index.html';
                        } else {
                            // Clean up invalid session
                            sessionStorage.removeItem('astro_admin_session');
                        }
                    } catch (e) {
                        sessionStorage.removeItem('astro_admin_session');
                    }
                }
            }
        })();
    </script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-wifi"></i>
                </div>
                <h1>Astro Services</h1>
                <p>Admin Panel Login</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter admin password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
                
                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>
                
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="login-footer">
                <p><i class="fas fa-info-circle"></i> Forgot password? Contact system administrator</p>
                <a href="/index.html" class="back-to-site">
                    <i class="fas fa-arrow-left"></i> Back to Website
                </a>
            </div>
        </div>
        
        <div class="login-background">
            <div class="login-glow"></div>
        </div>
    </div>

    <script src="/admin/auth.js?v=20241224080"></script>
    <script>
        // Toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.style.display = 'flex';
            
            // Shake animation
            errorDiv.classList.add('shake');
            setTimeout(() => errorDiv.classList.remove('shake'), 500);
        }

        // Hide error message
        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            
            try {
                const result = await handleAdminLogin(password);
                
                if (result.success) {
                    loginBtn.innerHTML = '<i class="fas fa-check"></i> Success!';
                    loginBtn.classList.add('success');
                    
                    // Redirect to admin panel
                    setTimeout(() => {
                        window.location.href = '/admin/index.html';
                    }, 500);
                } else {
                    showError(result.message);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                    
                    // Clear password field if locked
                    if (result.locked) {
                        document.getElementById('password').value = '';
                        document.getElementById('password').disabled = true;
                        loginBtn.disabled = true;
                    } else {
                        // Focus password field for retry
                        document.getElementById('password').select();
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('An error occurred. Please try again.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });

        // Auto-focus password field
        window.addEventListener('load', () => {
            document.getElementById('password').focus();
        });

        // Clear error on input
        document.getElementById('password').addEventListener('input', hideError);
    </script>
</body>
</html>
